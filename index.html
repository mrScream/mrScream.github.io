<script>
const target = document.getElementById("target");
const scoreText = document.getElementById("score");

let score = 0;
let moveInterval = 1000;
let timer;
let gameOver = false;

function move() {
    const x = Math.random() * (window.innerWidth - 80);
    const y = Math.random() * (window.innerHeight - 80);
    target.style.left = x + "px";
    target.style.top = y + "px";
}

function startTimer() {
    clearInterval(timer);
    timer = setInterval(move, moveInterval);
}

function endGame() {
    if (gameOver) return;
    gameOver = true;
    clearInterval(timer);
    alert("Game Over!\nFinal Score: " + score);
}

// Tap on the target
target.addEventListener("pointerdown", (e) => {
    e.stopPropagation(); // Prevents the body from receiving this tap

    if (gameOver) return;

    score++;
    scoreText.textContent = "Score: " + score;
    move();

    // Increase speed by 10% every 10 points
    if (score % 10 === 0) {
        moveInterval *= 0.9;
        startTimer();
    }
});

// Tap anywhere else = Game Over
document.body.addEventListener("pointerdown", () => {
    endGame();
});

move();
startTimer();
</script>
