<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Target Game</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    background:#222;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:white;
    touch-action:manipulation;
}

#score{
    position:absolute;
    top:15px;
    left:15px;
    font-size:30px;
    font-weight:bold;
    z-index:10;
}

#target{
    position:absolute;
    width:80px;
    height:80px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff4d4d,#ff0000);
    box-shadow:0 0 20px red;
    cursor:pointer;
}

/* Popup */

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:100;
}

#popup{
    width:90%;
    max-width:340px;
    background:white;
    border-radius:24px;
    padding:25px;
    text-align:center;
    color:#222;
    animation:pop .25s ease;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

@keyframes pop{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

#popup h1{
    margin:0;
    color:#ff3b30;
    font-size:34px;
}

#popup p{
    font-size:22px;
    margin:20px 0;
}

.buttons{
    display:flex;
    gap:12px;
}

button{
    flex:1;
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    color:white;
}

#restart{
    background:#34c759;
}

#close{
    background:#0a84ff;
}

button:active{
    transform:scale(.96);
}
</style>
</head>
<body>

<div id="score">Score: 0</div>
<div id="target"></div>

<div id="overlay">
    <div id="popup">
        <h1>🎮 Game Over</h1>
        <p id="finalScore"></p>

        <div class="buttons">
            <button id="restart">🔄 Play Again</button>
            <button id="close">❌ Exit</button>
        </div>
    </div>
</div>

<script>
const target=document.getElementById("target");
const scoreText=document.getElementById("score");
const overlay=document.getElementById("overlay");
const finalScore=document.getElementById("finalScore");
const restart=document.getElementById("restart");
const closeBtn=document.getElementById("close");

let score=0;
let moveInterval=1000;
let timer;
let gameOver=false;

function move(){
    if(gameOver) return;

    target.style.left=Math.random()*(window.innerWidth-80)+"px";
    target.style.top=Math.random()*(window.innerHeight-80)+"px";
}

function startTimer(){
    clearInterval(timer);
    timer=setInterval(move,moveInterval);
}

function endGame(){
    if(gameOver) return;

    gameOver=true;
    clearInterval(timer);

    finalScore.innerHTML=
        "🏆 Final Score<br><strong style='font-size:42px;color:#ff9500'>"+score+"</strong>";

    overlay.style.display="flex";
}

document.addEventListener("pointerdown",e=>{

    if(gameOver) return;

    if(e.target===target){

        score++;
        scoreText.textContent="Score: "+score;

        if(score%10===0){
            moveInterval*=0.9;
            startTimer();
        }

        move();

    }else{

        endGame();

    }

});

restart.onclick=()=>location.reload();

closeBtn.onclick=()=>{
    overlay.style.display="none";
};

move();
startTimer();

window.addEventListener("resize",move);
</script>

</body>
</html>
