<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Target Game</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#222;
    font-family:Arial,sans-serif;
    color:white;
    touch-action:manipulation;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    font-size:28px;
    z-index:10;
}

#target{
    position:absolute;
    width:80px;
    height:80px;
    border-radius:50%;
    background:#ff4444;
    box-shadow:0 0 20px red;
    cursor:pointer;
    touch-action:manipulation;
}
</style>
</head>
<body>

<div id="score">Score: 0</div>
<div id="target"></div>

<script>
const target = document.getElementById("target");
const scoreText = document.getElementById("score");

let score = 0;
let moveInterval = 1000;
let timer;
let gameOver = false;

function move() {
    if (gameOver) return;

    const x = Math.random() * (window.innerWidth - 80);
    const y = Math.random() * (window.innerHeight - 80);

    target.style.left = x + "px";
    target.style.top = y + "px";
}

function startTimer() {
    clearInterval(timer);
    timer = setInterval(move, moveInterval);
}

function endGame() {
    if (gameOver) return;

    gameOver = true;
    clearInterval(timer);

    setTimeout(() => {
        alert("Game Over!\n\nFinal Score: " + score);
    }, 50);
}

// Handle all touches/clicks
document.addEventListener("pointerdown", function(e) {
    if (gameOver) return;

    if (e.target === target) {
        // Ball tapped
        score++;
        scoreText.textContent = "Score: " + score;

        // Increase speed every 10 points
        if (score % 10 === 0) {
            moveInterval *= 0.9;
            startTimer();
        }

        move();
    } else {
        // Anywhere else = Game Over
        endGame();
    }
});

move();
startTimer();
</script>

</body>
</html>
